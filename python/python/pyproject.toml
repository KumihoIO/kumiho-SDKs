[project]
name = "kumiho"
version = "0.14.4"
description = "Python SDK for Kumiho Cloud - Graph-native creative & AI asset management"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kumiho Clouds", email = "support@kumiho.cloud" }
]
maintainers = [
    { name = "Kumiho Clouds", email = "support@kumiho.cloud" }
]
keywords = [
    "kumiho",
    "asset-management",
    "version-control",
    "graph-database",
    "vfx",
    "creative",
    "ai-assets",
    "lineage",
    "neo4j",
    "mcp",
    "model-context-protocol"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed"
]
dependencies = [
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "protobuf>=6.31.1",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://kumiho.io"
Documentation = "https://docs.kumiho.io"
Repository = "https://github.com/KumihoIO/kumiho-SDKs"
Changelog = "https://github.com/KumihoIO/kumiho-SDKs/blob/main/python/python/docs/changelog.md"
Issues = "https://github.com/KumihoIO/kumiho-SDKs/issues"

[project.scripts]
kumiho-auth = "kumiho.auth_cli:main"
kumiho-mcp = "kumiho.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
]
mcp = [
    # Bounded at BOTH ends, and every bound is exercised by a CI leg.
    #
    # Upper: mcp 2.0.0 removed the low-level handler decorators, and an
    # unbounded ">=1.0.0" meant every fresh install resolved to it and got a
    # server that raised at construction (kumiho-SDKs#145). "<3" keeps mcp 3.0
    # from repeating it; raise it only together with a CI leg for that major.
    #
    # Lower: 1.21.1 is the oldest release this code runs on with the newest
    # dependency set, not a guess. Two separate reasons stack, and the second
    # is the binding one today:
    #   - Tool-input validation. mcp.server.lowlevel.helper_types
    #     (ReadResourceContents) landed in 1.3.0, Server(version=...) in 1.2.1,
    #     and the call_tool decorator's validate_input in 1.10.0. Below that the
    #     1.x branch would silently skip tool-argument validation, since it
    #     relies on the SDK to do it.
    #   - pydantic 2.14. Every mcp from 1.2.0 through 1.21.0 imports
    #     ``eval_type_backport`` from ``pydantic._internal._typing_extra``
    #     (mcp/server/fastmcp/utilities/func_metadata.py), a private name that
    #     pydantic 2.14.0 removed. ``import mcp`` itself then raises
    #     ImportError, so MCP_AVAILABLE flips to False and kumiho-mcp cannot
    #     start. mcp 1.21.1 dropped that import. mcp's own pydantic bound
    #     ("<3") admits 2.14, and a marker on the kumiho extra cannot say
    #     "pydantic<2.14 only when mcp<1.21.1", so the floor is the one fix
    #     that makes every combination pip can resolve actually work.
    "mcp>=1.21.1,<3",
    # A transitive dependency of both mcp majors, but mcp_server.py imports it
    # directly to validate tool input on the 2.x path, so declare it.
    # Matches what mcp itself requires; the code path that uses it only runs
    # alongside mcp, so declaring anything weaker would be misleading.
    "jsonschema>=4.20.0",
    "httpx>=0.27.0",
]
all = [
    "kumiho[dev,docs,mcp]",
]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kumiho*"]

[tool.setuptools.package-data]
kumiho = ["py.typed", "proto/*.pyi"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["kumiho"]
omit = ["kumiho/proto/*"]
