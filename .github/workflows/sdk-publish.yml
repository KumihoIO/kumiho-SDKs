# Kumiho SDK - PyPI Publishing Workflow
#
# This workflow:
# 1. Runs the kumiho test suite against every supported mcp version
# 2. Publishes package to PyPI (on release tags), only if step 1 passed
#
# Step 1 was described here from the beginning but never actually existed: the
# only gate was a version-string comparison, so a tag on a red tree published
# anyway. A PyPI upload cannot be undone or re-uploaded under the same version,
# which makes this the one workflow where a missing test gate is unrecoverable.
# The matrix mirrors sdk-ci.yml's python job; keep the two in step.

name: Publish kumiho

on:
  push:
    tags:
      - 'sdk-v*'  # Trigger on tags like sdk-v0.9.3
  workflow_dispatch:  # Allow manual trigger
  pull_request:
    # So a change to this file is exercised BEFORE a release depends on it.
    # Without this the first run of any edit here is the release itself, which
    # is the worst possible place to discover a typo. publish-pypi is inert on
    # a pull_request: github.ref is refs/pull/N/merge, so its tag guard is
    # false and only the test matrix runs. No secrets, no upload.
    paths:
      - '.github/workflows/sdk-publish.yml'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # Test — the gate. publish-pypi cannot run unless every leg here passes.
  # ===========================================================================
  test:
    name: Test (mcp ${{ matrix.mcp-label }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/python
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared floor, then each supported major. Same three legs as
          # sdk-ci.yml: a release must be green on the whole declared range,
          # not just on whatever the resolver happens to pick.
          - mcp-label: '1.10.0 floor'
            mcp-spec: 'mcp==1.10.0'
          - mcp-label: '1.x'
            mcp-spec: 'mcp>=1,<2'
          - mcp-label: '2.x'
            mcp-spec: 'mcp>=2,<3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        # The pin goes on last: installing the extra resolves mcp to the newest
        # version the bound allows, which is not the major this leg is testing.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[mcp,dev]'
          pip install '${{ matrix.mcp-spec }}'
      - name: Show resolved mcp version
        run: python -c "import importlib.metadata as m; print(m.version('mcp'))"
      - name: Test
        # tests/ here is python/python/tests/. The pyproject/__version__ drift
        # guard (test_version.py) used to sit at python/tests/, where nothing
        # collected it — leaving the inline check in publish-pypi below as the
        # only enforcement of that invariant, and only at tag time, after merge
        # (kumiho-SDKs#153). It now runs on every PR as part of this suite. The
        # inline check stays: it also compares the git tag, which no test sees.
        run: python -m pytest tests/ -v

  # ===========================================================================
  # Build & Publish to PyPI
  # ===========================================================================
  publish-pypi:
    # Only publish on version tags, and only behind a green test matrix.
    # `needs` also means a skipped or cancelled test job blocks the upload
    # rather than waving it through.
    needs: test
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/python

    environment:
      name: pypi-sdk
      url: https://pypi.org/project/kumiho/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine toml

      - name: Verify version matches tag
        # Checks all three surfaces, not just pyproject. kumiho/__init__.py
        # went unchecked and drifted: 0.10.8 shipped to PyPI while __version__
        # still said 0.10.7, and __version__ is what the MCP server advertises
        # as serverInfo.version. Any new place the version is written belongs
        # here too.
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/sdk-v}"
          PKG_VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          DUNDER_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('kumiho/__init__.py').read()).group(1))")
          echo "Tag version:        $TAG_VERSION"
          echo "pyproject.toml:     $PKG_VERSION"
          echo "__init__.__version__: $DUNDER_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch! Tag: $TAG_VERSION, pyproject.toml: $PKG_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$DUNDER_VERSION" ]; then
            echo "Version mismatch! Tag: $TAG_VERSION, kumiho/__init__.py: $DUNDER_VERSION"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
