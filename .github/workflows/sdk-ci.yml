# SDK CI — builds and tests the Go, Rust and Python SDKs on pull requests.
#
# The Go SDK ships generated protobuf (go/kumihopb), so it needs no submodule
# or protoc. The Rust SDK generates protobuf at build time via build.rs
# (tonic-build), so it needs the rust/proto submodule and protoc on PATH.
#
# build, test and fmt are hard gates; clippy is advisory (continue-on-error)
# so a new lint suggestion never blocks a PR that compiles and passes tests.
name: SDK CI

on:
  pull_request:
    paths:
      - 'go/**'
      - 'rust/**'
      - 'python/**'
      - '.github/workflows/sdk-ci.yml'
  push:
    branches: [main]
    paths:
      - 'go/**'
      - 'rust/**'
      - 'python/**'
      - '.github/workflows/sdk-ci.yml'

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  python:
    # One leg per supported mcp major. mcp 2.0.0 removed the low-level handler
    # decorators, and with no upper bound in pyproject every fresh install of
    # kumiho[mcp] resolved to it and got a server that raised at construction
    # (kumiho-SDKs#145). Nothing in CI or the test suite called
    # create_mcp_server(), so it shipped silently. This matrix is what makes the
    # next major bump fail here instead of at a user's first launch — when the
    # mcp bound in pyproject is raised, add the new major here in the same PR.
    name: Python (mcp ${{ matrix.mcp-label }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/python
    strategy:
      fail-fast: false
      matrix:
        include:
          # The exact declared floor. A range is only supported if its edges
          # are tested: ">=1.0.0" was declared once and turned out not to
          # import at all below 1.3.0, nor validate tool input below 1.10.0.
          # If this leg fails, the floor in pyproject.toml is wrong.
          - mcp-label: '1.10.0 floor'
            mcp-spec: 'mcp==1.10.0'
          - mcp-label: '1.x'
            mcp-spec: 'mcp>=1,<2'
          - mcp-label: '2.x'
            mcp-spec: 'mcp>=2,<3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        # The pin goes on last: installing the extra resolves mcp to the newest
        # version the bound allows, which is not the major this leg is testing.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[mcp,dev]'
          pip install '${{ matrix.mcp-spec }}'
      - name: Show resolved mcp version
        run: python -c "import importlib.metadata as m; print(m.version('mcp'))"
      - name: Test
        # tests/ here is python/python/tests/. It used to hold 4 files while a
        # 21-file suite sat unreferenced at python/tests/ (kumiho-SDKs#153);
        # that suite now lives here and is collected by this same command.
        # Its live tests skip without KUMIHO_AUTH_TOKEN, which CI does not set.
        run: python -m pytest tests/ -v

  python-cli:
    # kumiho-cli is a second distribution with its own pyproject and its own
    # tests, and they were never run either — same root cause as #153, one
    # directory over. It needs the SDK installed first: its own tests assert
    # that kumiho_cli.ensure_token *is* kumiho.auth_cli.ensure_token, so a
    # resolver-fetched kumiho from PyPI would test the wrong pairing.
    name: Python CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./python/python
          pip install -e ./python/kumiho-cli
          pip install pytest
      - name: Test
        working-directory: python/kumiho-cli
        run: python -m pytest tests/ -v

  rust:
    name: Rust (build / test / fmt / clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Test
        run: cargo test --features mock-server --verbose
      - name: Package check
        # Verifies the crate packages cleanly (esp. that proto/kumiho.proto from
        # the submodule is included) and builds from the packaged source.
        run: cargo publish --dry-run
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --all-targets
